<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131b"><title>NeoCut — 무료 동영상 편집기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><a class="brand" href="#">Neo<span>Cut</span></a><span class="tag">FREE VIDEO STUDIO</span><button id="importBtn" class="primary">＋ 영상 불러오기</button><input id="fileInput" type="file" accept="video/*" hidden></header>
<main>
<section class="workspace">
<div class="preview-wrap"><div class="preview-empty" id="empty">영상을 불러와 편집을 시작하세요</div><video id="video" playsinline controls hidden></video><div id="captionPreview" class="caption-preview"></div></div>
<div class="preview-actions"><button id="playBtn">▶ 재생</button><span id="timeLabel">00:00 / 00:00</span><button id="exportBtn" class="primary" disabled>내보내기 (WebM)</button></div>
</section>
<aside class="tools">
<h2>편집 도구</h2>
<label class="field">시작 시간 (초)<input id="trimStart" type="number" min="0" step="0.1" value="0"></label>
<label class="field">종료 시간 (초)<input id="trimEnd" type="number" min="0" step="0.1" value="0"></label>
<button id="applyTrim">구간 미리보기 적용</button>
<p class="hint">현재 버전은 선택한 구간을 미리보기로 이동합니다. 정밀 컷 편집과 멀티트랙은 개발 예정입니다.</p>
<hr>
<h2>자막</h2>
<label class="field">자막 내용<input id="captionText" type="text" placeholder="자막을 입력하세요"></label>
<label class="field">글자 색상<input id="captionColor" type="color" value="#ffffff"></label>
<label class="field">글자 크기<input id="captionSize" type="range" min="18" max="54" value="30"></label>
<button id="clearCaption">자막 지우기</button>
<hr><h2>타임라인</h2><div id="clipName" class="clip-empty">아직 영상이 없습니다</div><div class="timeline"><div id="timelineFill"></div></div><p class="hint">NeoCut은 독립 프로젝트이며 CapCut의 상표·코드를 복제하지 않습니다.</p>
</aside>
</main>
<footer>NeoCut · 무료로 시작하는 나만의 편집기 · 프로젝트는 이 기기에서 처리됩니다.</footer>
<script src="app.js"></script>
</body></html>
