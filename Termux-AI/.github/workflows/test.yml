name: test
on: [push, pull_request]
jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s Termux-AI/tests -v
      - run: python -m py_compile Termux-AI/termux_ai.py
