<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060c">
<meta name="description" content="Neo-1 — 직접 학습시킨 AI 모델과 실제로 대화하는 페이지. 양양의 VPS에서 실시간으로 답합니다.">
<title>Neo-1 AI 채팅 · NeoOS</title>
<style>
:root{color-scheme:dark;--bg:#05060c;--panel:#0c1020;--line:#232a44;--text:#f2f5ff;--muted:#9aa6c6;--violet:#8b5cf6;--cyan:#22d3ee;--green:#4ade80;--amber:#fbbf24;--red:#f87171}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font:16px/1.6 system-ui,-apple-system,"Noto Sans KR","Segoe UI",Roboto,sans-serif;
background:radial-gradient(ellipse 70% 45% at 12% -8%,#3b1a7a55 0,transparent 60%),radial-gradient(ellipse 60% 40% at 92% 0%,#0e4a5e66 0,transparent 55%),var(--bg)}
.page{max-width:760px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;min-height:100vh}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;background:conic-gradient(from 200deg,#7c3aed,#22d3ee,#f472b6,#7c3aed)}
.brand b{font-size:1.02rem}.brand small{display:block;color:var(--muted);font-size:.7rem;letter-spacing:.06em}
.back{font-size:.8rem;color:var(--muted);text-decoration:none;border:1px solid var(--line);background:#0a0e1bcc;padding:8px 12px;border-radius:999px}
h1{font-size:1.5rem;margin:4px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:.88rem;margin:0 0 14px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;margin-bottom:16px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.status.on i{background:var(--green);box-shadow:0 0 10px var(--green)}
.status.off i{background:var(--red)}
.chat{flex:1;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#0e1324e6,#0a0e1ae6);padding:16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:320px;max-height:58vh}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:.94rem;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#1d2a52;border:1px solid #2c3d6e;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:#101a30;border:1px solid #22304f;border-bottom-left-radius:6px}
.msg.sys{align-self:center;background:transparent;border:none;color:var(--muted);font-size:.8rem;text-align:center}
.msg.wait{color:var(--muted)}
form{display:flex;gap:8px;margin-top:14px}
input[type=text]{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--text);padding:13px 15px;font-size:.95rem;outline:none}
input[type=text]:focus{border-color:#3d4a70}
button{background:linear-gradient(90deg,#7c3aed,#22d3ee);color:#04060d;font-weight:800;border:none;border-radius:14px;padding:0 20px;font-size:.95rem;cursor:pointer}
button:disabled{opacity:.45;cursor:wait}
.note{color:#6c7a99;font-size:.76rem;margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <a class="brand" href="/">
      <span class="logo" aria-hidden="true">N</span>
      <span><b>NeoOS</b><small>NEO-1 AI CHAT</small></span>
    </a>
    <a class="back" href="/">← 홈으로</a>
  </header>

  <h1>🤖 Neo-1에게 물어보기</h1>
  <p class="sub">직접 학습시킨 AI 모델이 실제로 답하는 페이지예요. 가짜 데모가 아니라, 지금 VPS에서 돌아가는 모델이 실시간으로 답합니다.</p>
  <div><span class="status" id="status"><i></i><span id="statusText">서버 확인 중…</span></span></div>

  <div class="chat" id="chat">
    <div class="msg sys">Neo-1에게 말을 걸어 보세요. 예: "대한민국의 수도는 어디야?"</div>
  </div>

  <form id="form">
    <input type="text" id="input" placeholder="메시지를 입력하세요" autocomplete="off" maxlength="2000">
    <button type="submit" id="send">보내기</button>
  </form>

  <p class="note">작은 모델(1.2B)이라 틀린 답이나 반복이 있을 수 있어요. 최신 정보는 검색이 안 되니 지어낼 수 있습니다. 서버(VPS)가 꺼져 있으면 답할 수 없어요.</p>
</div>

<script>
var API = "https://8091-agq4jaayolghua7jofmyvhd3a4.instabox.tech";
var KEY = "1c5fd8fc6119de39fbf38d78";
var chat = document.getElementById('chat');
var form = document.getElementById('form');
var input = document.getElementById('input');
var send = document.getElementById('send');
var statusEl = document.getElementById('status');
var statusText = document.getElementById('statusText');
var history = [];
var modelName = "Neo-1";

function addMsg(text, cls){
  var d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function checkHealth(){
  fetch(API + '/health').then(function(r){ return r.json(); }).then(function(j){
    if (j.ok) {
      modelName = (j.model || 'neo-1').replace(':latest','') === 'neo-1-plus' ? 'Neo-1 Plus' : 'Neo-1';
      statusEl.className = 'status on';
      statusText.textContent = '● ' + modelName + ' 작동 중 (VPS 실시간 연결)';
    } else {
      statusEl.className = 'status off';
      statusText.textContent = '● 모델이 꺼져 있어요';
    }
  }).catch(function(){
    statusEl.className = 'status off';
    statusText.textContent = '● 서버(VPS)가 꺼져 있어요';
  });
}
checkHealth();

form.addEventListener('submit', function(e){
  e.preventDefault();
  var text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = '';
  addMsg(text, 'user');
  history.push({role:'user', content:text});
  var wait = addMsg(modelName + '이(가) 생각 중…', 'bot wait');
  send.disabled = true;
  fetch(API + '/chat', {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'X-Neo-Key': KEY},
    body: JSON.stringify({messages: history.slice(-12)})
  }).then(function(r){
    return r.json().then(function(j){ return {status: r.status, body: j}; });
  }).then(function(res){
    wait.remove();
    if (res.status === 200 && res.body.reply) {
      addMsg(res.body.reply, 'bot');
      history.push({role:'assistant', content: res.body.reply});
    } else if (res.status === 429) {
      addMsg('지금 묻는 사람이 많거나 사용 한도를 넘었어요. 잠시 뒤에 다시 해주세요.', 'sys');
      history.pop();
    } else if (res.status === 503) {
      addMsg('모델이 꺼져 있어서 답할 수 없어요.', 'sys');
      history.pop();
    } else {
      addMsg('답을 가져오지 못했어요. 잠시 뒤에 다시 해주세요.', 'sys');
      history.pop();
    }
  }).catch(function(){
    wait.remove();
    addMsg('서버(VPS)가 꺼져 있어서 연결할 수 없어요.', 'sys');
    history.pop();
  }).finally(function(){
    send.disabled = false;
    input.focus();
  });
});
</script>
</body>
</html>
