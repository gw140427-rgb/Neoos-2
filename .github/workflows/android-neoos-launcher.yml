name: Android NeoOS Launcher

on:
  push:
    branches: [main, "feature/android-neoos-launcher"]
    paths:
      - "android-neoos/**"
      - ".github/workflows/android-neoos-launcher.yml"
  pull_request:
    paths:
      - "android-neoos/**"
      - ".github/workflows/android-neoos-launcher.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android-neoos :app:assembleDebug
