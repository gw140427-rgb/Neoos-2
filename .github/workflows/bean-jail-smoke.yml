name: Bean Jail Survival smoke checks

on:
  push:
    branches:
      - main
      - feature/bean-jail-survival-20261017
    paths:
      - 'docs/bean-jail/**'
      - 'docs/index.html'
      - 'tests/bean-jail-smoke.py'
      - '.github/workflows/bean-jail-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/bean-jail/**'
      - 'docs/index.html'
      - 'tests/bean-jail-smoke.py'
      - '.github/workflows/bean-jail-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js for JavaScript syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run game smoke checks
        run: python tests/bean-jail-smoke.py
