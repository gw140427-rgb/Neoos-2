name: NeoCut app packages
on:
  workflow_dispatch:
  push:
    branches:
      - feature/neocut-editor
    paths:
      - "apps/neocut-web/**"
      - "apps/neocut-desktop/**"
      - "apps/neocut-android/**"
      - ".github/workflows/neocut-packages.yml"
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-installer
          - os: ubuntu-latest
            artifact: linux-packages
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/neocut-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: neocut-${{ matrix.artifact }}
          path: apps/neocut-desktop/release/*
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Capacitor dependencies and generate Android project
        working-directory: apps/neocut-android
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: apps/neocut-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: neocut-android-debug-apk
          path: apps/neocut-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-downloads:
    name: Publish direct download links
    runs-on: ubuntu-latest
    needs: [desktop, android]
    if: always()
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download whichever packages built successfully
        uses: actions/download-artifact@v4
        with:
          pattern: neocut-*
          path: release-files
          merge-multiple: true
          if-no-artifact-found: warn
      - name: Give packages stable download names
        shell: bash
        run: |
          mkdir -p stable
          find release-files -type f -iname '*.exe' -print -quit | while read -r f; do cp "$f" stable/NeoCut-Windows-x64.exe; done
          find release-files -type f -iname '*.AppImage' -print -quit | while read -r f; do cp "$f" stable/NeoCut-Linux-x86_64.AppImage; done
          find release-files -type f -iname '*.deb' -print -quit | while read -r f; do cp "$f" stable/NeoCut-Linux-amd64.deb; done
          find release-files -type f -iname '*.apk' -print -quit | while read -r f; do cp "$f" stable/NeoCut-Android.apk; done
          echo "Published package candidates:"
          ls -lh stable || true
          test -n "$(find stable -maxdepth 1 -type f -print -quit)"
      - name: Publish or update the stable download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: neocut-latest
          name: NeoCut — 최신 자동 다운로드
          body: |
            이 릴리스는 NeoCut 패키지 빌드가 끝날 때마다 자동 갱신됩니다.
            빌드에 성공한 플랫폼의 파일만 포함됩니다. Android 파일은 테스트용 debug APK입니다.
          target_commitish: feature/neocut-editor
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: stable/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
