name: Build Hachuping Launcher APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-launchers/hachuping/**'
      - '.github/workflows/build-hachuping-launcher.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: android-launchers/hachuping
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hachuping-launcher-debug-apk
          path: android-launchers/hachuping/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
